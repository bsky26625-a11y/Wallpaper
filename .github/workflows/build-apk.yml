
name: Build CS Exam Live Wallpaper APK

on:
  workflow_dispatch:
  push:
    paths:
      - "CSExamLiveWallpaper_step5_build_guide.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android project ZIP
        run: |
          mkdir -p project
          unzip -q CSExamLiveWallpaper_step5_build_guide.zip -d project

      - name: Build debug APK
        run: gradle -p project assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: cs-exam-live-wallpaper-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
